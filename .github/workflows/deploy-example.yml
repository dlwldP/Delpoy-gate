# .github/workflows/deploy-example.yml
#
# Demonstrates how a CI/CD pipeline calls deploy-gate's POST /approval/check
# right before `cdk deploy`. This workflow builds and boots the real
# deploy-gate app, then exercises both branches of the approval decision
# using the seeded demo data (see config/DemoDataSeeder):
#   - jiye -> SmallAppStack: has the required claim, approvalLevel=NONE -> 200 OK
#   - jiye -> ProdAlbStack: approvalLevel=DUAL_APPROVER (no approval flow yet) -> 403 Forbidden
name: Deploy Example (deploy-gate integration demo)

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build executable jar
        run: ./gradlew bootJar

      - name: Start deploy-gate
        run: |
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' | head -n 1)
          echo "Starting $JAR"
          nohup java -jar "$JAR" > app.log 2>&1 &
          echo "Waiting for /actuator/health..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"UP"'; then
              echo "deploy-gate is up"
              exit 0
            fi
            sleep 2
          done
          echo "deploy-gate did not become healthy in time"
          cat app.log
          exit 1

      - name: cdk deploy step (SmallAppStack) -- expect approval
        run: |
          STATUS=$(curl -s -o response.json -w '%{http_code}' -X POST http://localhost:8080/approval/check \
            -H 'Content-Type: application/json' \
            -d '{"user":"jiye","stack":"SmallAppStack","action":"DEPLOY"}')
          echo "response: $(cat response.json)"
          if [ "$STATUS" != "200" ]; then
            echo "expected 200 OK for SmallAppStack but got $STATUS"
            exit 1
          fi
          echo "approved -> cdk deploy SmallAppStack (example, not actually run)"

      - name: cdk deploy step (ProdAlbStack) -- expect block
        run: |
          STATUS=$(curl -s -o response.json -w '%{http_code}' -X POST http://localhost:8080/approval/check \
            -H 'Content-Type: application/json' \
            -d '{"user":"jiye","stack":"ProdAlbStack","action":"DEPLOY"}')
          echo "response: $(cat response.json)"
          if [ "$STATUS" != "403" ]; then
            echo "expected 403 Forbidden for ProdAlbStack but got $STATUS"
            exit 1
          fi
          echo "blocked -> cdk deploy ProdAlbStack aborted (expected)"

      - name: Show app log
        if: always()
        run: cat app.log
